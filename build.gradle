plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.warranty'
version = '1.0.0'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql:42.7.1'
    
    // Flyway - Database migrations
    implementation 'org.flywaydb:flyway-core:9.22.3'

    // Springdoc OpenAPI (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
    
    // Configure test logging for clear visibility
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams false
        showCauses true
        showStackTraces true
    }
}

bootRun {
    systemProperty 'spring.profiles.active', 'dev'
}

// Task to validate file encoding (UTF-8 without BOM)
task checkFileEncoding {
    description = 'Validates that project text files are UTF-8 without BOM'
    group = 'verification'
    
    doLast {
        // Define file patterns to check
        def filePatterns = [
            'src/**/*.java',
            'src/**/*.properties',
            'src/**/*.yaml',
            'src/**/*.yml',
            'src/**/*.json',
            'src/**/*.sql',
            'src/**/*.gradle',
            'src/**/*.xml',
            'src/**/*.md',
            '.kiro/**/*.yaml',
            '.kiro/**/*.yml',
            '.kiro/**/*.json',
            '.kiro/**/*.md',
            '*.gradle',
            '*.md',
            '*.yaml',
            '*.yml',
            'gradle.properties'
        ]
        
        def validatorScript = '.kiro/scripts/validate-file-encoding.ps1'
        
        // Check if validator script exists
        if (!file(validatorScript).exists()) {
            throw new GradleException("Validator script not found: $validatorScript")
        }
        
        // Collect all files to validate
        def filesToCheck = [] as Set
        filePatterns.each { pattern ->
            fileTree(dir: rootDir, include: pattern).each { f ->
                if (f.isFile()) {
                    filesToCheck.add(f)
                }
            }
        }
        
        if (filesToCheck.isEmpty()) {
            println "No files matched for encoding validation"
            return
        }
        
        println "Checking ${filesToCheck.size()} file(s) for UTF-8 without BOM encoding..."
        
        def failedFiles = []
        def passedCount = 0
        
        filesToCheck.each { file ->
            def relativePath = rootDir.toPath().relativize(file.toPath()).toString()
            
            // Run validator script
            def process = [
                'powershell.exe', '-NoProfile', '-File', validatorScript,
                '-FilePath', file.absolutePath
            ].execute()
            
            def exitCode = process.waitFor()
            def errorOutput = process.errorStream.text
            
            if (exitCode == 0) {
                passedCount++
            } else if (exitCode == 1) {
                failedFiles.add(relativePath)
                println "  ✗ $relativePath"
                if (errorOutput) {
                    println "    ${errorOutput.split('\n').first()}"
                }
            } else {
                // Exit code 2 or other: file not readable
                println "  ⚠ $relativePath (could not validate: $errorOutput)"
            }
        }
        
        println ""
        println "Encoding validation complete: $passedCount passed, ${failedFiles.size()} failed"
        
        if (!failedFiles.isEmpty()) {
            def failureMessage = "The following files do not use UTF-8 without BOM:\n"
            failedFiles.each { f ->
                failureMessage += "  - $f\n"
            }
            throw new GradleException(failureMessage)
        }
    }
}
